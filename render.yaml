services:
  - type: web
    name: form990-explorer
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -b 0.0.0.0:$PORT -w 1 --timeout 120 web.app:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
